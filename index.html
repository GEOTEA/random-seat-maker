<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>랜덤 자리배치</title>
  <meta name="description" content="교사를 위한 간편한 랜덤 자리배치 웹앱">
  <style>
    :root{--green:#183f38;--mint:#e5f0eb;--paper:#f6f3ed;--line:#ddd8cc;--orange:#d46846;--ink:#20322e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}header{background:var(--green);color:#fff;border-bottom:1px solid #d8d4c9}.head{max-width:1440px;margin:auto;padding:16px 28px;display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#f3c969;color:var(--green);font-size:22px}.head h1{font-size:20px;margin:0}.head p{font-size:12px;color:#d9e5df;margin:2px 0 0}.app{max-width:1440px;margin:auto;padding:28px;display:grid;grid-template-columns:350px 1fr;gap:20px}.side{display:flex;flex-direction:column;gap:16px}.card,.room{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(43,54,48,.06)}.card{padding:20px}.title{display:flex;justify-content:space-between;font-weight:750;margin-bottom:14px}.count{font-size:12px;padding:5px 10px;background:var(--mint);color:#236452;border-radius:99px}textarea{width:100%;min-height:190px;padding:12px;border:1px solid #d9d5ca;border-radius:10px;background:#fbfaf7;font:inherit;line-height:1.7;resize:vertical}button,.upload{border:1px solid #d4d0c4;background:#fff;color:var(--ink);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.clear{grid-column:1/-1;border:0;color:#747c78}.upload input{display:none}.layouts{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #dedbd2;border-radius:12px;cursor:pointer}.choice:has(input:checked){border-color:#2c7965;background:#eff7f3}.choice strong{display:block;font-size:14px}.choice small{color:#68756f}.arrange{background:var(--orange);border:0;color:#fff;font-size:16px;padding:15px;box-shadow:0 8px 18px rgba(212,104,70,.2)}.room{min-height:650px;padding:28px}.roomtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.roomtop h2{font-size:18px;margin:0}.roomtop p{font-size:14px;color:#6e7873;margin:5px 0 0}.classroom{background:#f8f5ee;border:1px solid #dfd9cb;border-radius:18px;padding:24px}.board{max-width:580px;margin:auto;background:#315e55;color:#fff;border-radius:8px;padding:12px;text-align:center;font-size:14px;font-weight:750;letter-spacing:.35em;box-shadow:0 4px 10px #0002}.desk{width:145px;margin:12px auto 38px;background:#9b6c4a;color:#fff;border-radius:0 0 16px 16px;padding:12px;text-align:center;font-size:14px;font-weight:750;box-shadow:0 4px 10px #0002}.seats{max-width:980px;margin:auto;display:grid;gap:16px}.seat{min-height:76px;display:flex;align-items:center;justify-content:center;background:#fffdf8;border:1px solid #d5c8aa;border-radius:12px;box-shadow:0 3px 0 #d9c9a5;font-weight:750;text-align:center}.seat i{font-size:10px;color:#9b9589;font-style:normal;margin-right:5px}.empty{min-height:400px;display:grid;place-items:center;text-align:center;color:#79827d}.empty b{display:block;color:var(--ink);margin-bottom:7px}.gap{margin-left:26px}footer{text-align:center;color:#858b87;font-size:12px;padding:0 15px 28px}
    @media(max-width:900px){.app{grid-template-columns:1fr;padding:16px}.room{min-height:auto;padding:16px}.classroom{padding:12px}.seat{min-height:62px;font-size:14px}.gap{margin-left:10px}}@media(max-width:520px){.head{padding:14px 16px}.seats{gap:10px 5px}.seat{font-size:12px}.seat i{display:none}.roomtop{align-items:flex-start}.desk{margin-bottom:28px}}
  </style>
</head>
<body>
  <header><div class="head"><span class="logo">🎓</span><div><h1>랜덤 자리배치</h1><p>교실의 자리를 빠르고 공정하게</p></div></div></header>
  <main class="app">
    <aside class="side">
      <section class="card">
        <div class="title"><span>👥 학생 명단</span><span class="count" id="count">12명</span></div>
        <textarea id="names" aria-label="학생 명단">김민준
이서연
박지호
최하은
정도윤
한지민
윤서준
임수아
조현우
강예린
송지후
신채원</textarea>
        <div class="actions">
          <button id="template">↓ 양식 받기</button>
          <label class="upload">↑ 명단 불러오기<input id="file" type="file" accept=".csv,.txt"></label>
          <button class="clear" id="clear">↻ 명단 비우기</button>
        </div>
      </section>
      <section class="card">
        <div class="title">자리 형태</div>
        <div class="layouts">
          <label class="choice"><input type="radio" name="layout" value="five" checked><span><strong>5줄형</strong><small>한 줄에 한 명씩 5열</small></span></label>
          <label class="choice"><input type="radio" name="layout" value="six"><span><strong>6줄형</strong><small>한 줄에 한 명씩 6열</small></span></label>
          <label class="choice"><input type="radio" name="layout" value="groups"><span><strong>3분단형</strong><small>짝꿍 2명씩 3분단</small></span></label>
        </div>
      </section>
      <button class="arrange" id="arrange">↝ 자리 배치하기</button>
    </aside>
    <section class="room">
      <div class="roomtop"><div><h2>교실 배치도</h2><p id="notice">명단과 자리 형태를 확인한 뒤 배치해 주세요.</p></div><button id="reshuffle" hidden>↝ 다시 섞기</button></div>
      <div class="classroom"><div class="board">칠 판</div><div class="desk">교 탁</div><div id="seats" class="seats"><div class="empty"><div><b>아직 자리가 비어 있어요</b>왼쪽에서 명단과 자리 형태를 확인해 주세요.</div></div></div></div>
    </section>
  </main>
  <footer>명단은 서버에 전송되지 않고 현재 브라우저에서만 처리됩니다.</footer>
  <script>
    const namesEl=document.querySelector('#names'),countEl=document.querySelector('#count'),seatsEl=document.querySelector('#seats'),notice=document.querySelector('#notice'),reshuffle=document.querySelector('#reshuffle');
    const getNames=()=>{const seen=new Set;return namesEl.value.split(/[\n,;\t]+/).map(v=>v.trim()).filter(v=>v&&!seen.has(v)&&seen.add(v))};
    const update=()=>{countEl.textContent=getNames().length+'명';seatsEl.innerHTML='<div class="empty"><div><b>아직 자리가 비어 있어요</b>왼쪽에서 명단과 자리 형태를 확인해 주세요.</div></div>';reshuffle.hidden=true};
    const mix=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function arrange(){const names=getNames();if(!names.length){notice.textContent='먼저 학생 명단을 입력해 주세요.';return}const type=document.querySelector('[name=layout]:checked').value,cols=type==='five'?5:6,seats=mix(names);seatsEl.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';seatsEl.innerHTML=seats.map((name,i)=>'<div class="seat '+(type==='groups'&&(i%6===2||i%6===4)?'gap':'')+'"><i>'+(i+1)+'</i>'+name.replace(/[<>&]/g,'')+'</div>').join('');notice.textContent=names.length+'명의 자리를 무작위로 배치했어요.';reshuffle.hidden=false}
    namesEl.addEventListener('input',update);document.querySelectorAll('[name=layout]').forEach(el=>el.addEventListener('change',update));document.querySelector('#arrange').onclick=arrange;reshuffle.onclick=arrange;
    document.querySelector('#clear').onclick=()=>{namesEl.value='';update()};
    document.querySelector('#template').onclick=()=>{const blob=new Blob(['\ufeff이름\r\n김민준\r\n이서연\r\n박지호\r\n'],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='자리배치_명단양식.csv';a.click();URL.revokeObjectURL(a.href);notice.textContent='CSV 명단 양식을 내려받았어요.'};
    document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!/\.(csv|txt)$/i.test(f.name)){notice.textContent='CSV 또는 TXT 파일을 선택해 주세요.';return}let rows=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean).map(r=>r.split(',')[0].trim()).filter(Boolean);if(/^(이름|성명|학생명)$/i.test(rows[0]||''))rows.shift();namesEl.value=rows.join('\n');update();notice.textContent=f.name+'에서 '+rows.length+'명을 불러왔어요.'};
  </script>
</body>
</html>
